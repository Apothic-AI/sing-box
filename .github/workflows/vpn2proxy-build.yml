name: vpn2proxy sing-box build

# Builds the vpn2proxy-patched sing-box from the `vpn2proxy/auth-user` branch
# and publishes linux binaries as a release on this fork (public, so the
# appliance can curl them without a token). This workflow lives on the
# `vpn2proxy/ci` branch so the patch branch stays clean for an upstream PR.
#
# Dispatch:
#   gh workflow run "vpn2proxy sing-box build" --ref vpn2proxy/ci \
#     -f sing_box_version=1.14.1 -f release_tag=vpn2proxy-v1.14.1.1
#
# The build tags/flags mirror upstream `release/DEFAULT_BUILD_TAGS_OTHERS`.

on:
  workflow_dispatch:
    inputs:
      sing_box_version:
        description: "Upstream sing-box version (becomes constant.Version)"
        required: true
        default: "1.14.1"
      release_tag:
        description: "Release tag to publish (immutable; e.g. vpn2proxy-v1.14.1.1)"
        required: true
        default: "vpn2proxy-v1.14.1.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: vpn2proxy/auth-user
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.6"

      - name: Build
        env:
          VER: ${{ inputs.sing_box_version }}
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildvcs=false \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VER}' -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid=" \
            -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0" \
            -o sing-box ./cmd/sing-box
          file sing-box
          # only the native-arch binary can be executed on the runner
          if [ "${{ matrix.goarch }}" = "$(go env GOARCH)" ]; then
            ./sing-box version
          fi

      - name: Package (upstream-style tarball)
        env:
          VER: ${{ inputs.sing_box_version }}
        run: |
          set -euo pipefail
          DIR="sing-box-${VER}-linux-${{ matrix.goarch }}"
          mkdir -p "dist/${DIR}"
          cp sing-box "dist/${DIR}/sing-box"
          tar -C dist -czf "dist/${DIR}.tar.gz" "${DIR}"
          rm -rf "dist/${DIR}"
          ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          VER: ${{ inputs.sing_box_version }}
        run: |
          set -euo pipefail
          NOTES="vpn2proxy build of sing-box ${VER} (source: vpn2proxy/auth-user @ ${{ github.sha }}). GPL-3.0; executed as a separate binary, never linked."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz --clobber
          else
            gh release create "$TAG" dist/*.tar.gz --title "$TAG" --notes "$NOTES"
          fi
